name: Build Windows and macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "engine.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x64
            artifact: FolderExporter-Windows-x64
            platform: windows
          - os: macos-15
            name: macOS Apple Silicon
            artifact: FolderExporter-macOS-AppleSilicon
            platform: macos
          - os: macos-15-intel
            name: macOS Intel
            artifact: FolderExporter-macOS-Intel
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip "pyinstaller>=6.10,<7" pytest -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q tests
      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name FolderExporter --collect-all psd_tools app.py
      - name: Package Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FolderExporter -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Package macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          test -d "dist/FolderExporter.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/FolderExporter.app" "${{ matrix.artifact }}.zip"
      - name: Upload downloadable application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30
